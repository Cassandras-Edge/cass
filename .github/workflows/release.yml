name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-amd64
          - os: windows-latest
            target: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install .

      - name: Build binary
        # --copy-metadata includes cass's .dist-info so that importlib.metadata
        # can resolve the version inside the frozen binary. Without it,
        # CURRENT_VERSION falls back to "0.0.0-dev".
        run: pyinstaller --onefile --copy-metadata cass --name cass-${{ matrix.target }} --clean cass_entry.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cass-${{ matrix.target }}
          path: dist/cass-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true

  bump-scoop:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'cass-windows-amd64.exe' --dir /tmp --clobber

          HASH=$(sha256sum /tmp/cass-windows-amd64.exe | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v${VERSION}/cass-windows-amd64.exe#/cass.exe"

          jq --arg v "$VERSION" --arg h "$HASH" --arg u "$URL" '
            .version = $v
            | .architecture["64bit"].url = $u
            | .architecture["64bit"].hash = $h
          ' scoop/cass.json > scoop/cass.json.new
          mv scoop/cass.json.new scoop/cass.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scoop/cass.json
          if git diff --cached --quiet; then
            echo "scoop manifest already up to date"
            exit 0
          fi
          git commit -m "chore(scoop): bump to v${VERSION}"
          git push origin main

[project]
name = "cass"
version = "0.7.3"
description = "Cassandra platform CLI — auth, keys, cookies, and service management"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "schwab-py==1.5.1",
    "websockets>=13.0",
    "qrcode>=8.0",
]

[project.optional-dependencies]
# In-process OPF deep scan for `cass share create` on Apple Silicon.
# `mlx-embeddings` on PyPI (0.1.0) doesn't yet include the privacy-filter
# architecture; pin to git main until a versioned release ships it.
deepscan = [
    "mlx-embeddings @ git+https://github.com/Blaizzy/mlx-embeddings.git@main",
    "mlx",
    "numpy",
    "tiktoken",
]

[project.scripts]
cass = "cass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cass"]

[tool.hatch.metadata]
# deepscan extra uses a git+https direct reference until mlx-embeddings ships
# OPF support in a PyPI release.
allow-direct-references = true
